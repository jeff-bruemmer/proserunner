schema = 1
explain = "A heading is a label, not a sentence, so it doesn't end with a period."
case = "sensitive"
scope = ["heading"]

patterns = [
    { match = '\.\s*$', message = "Heading ends with a period: delete it." },
]

[examples]
bad = ["# A heading that ends with a period."]
good = ["# A heading", "A sentence ends with a period."]
